function match(){const right=shuffle(round);panel.innerHTML=`<div class="panel-head"><b>配一配 · 先点马来文，再点中文</b><span id="pairCount">0 / ${round.length} 对</span></div><p class="subtle">同一轮的10个词，配对成功后会变绿。</p><div class="pair-grid"><div class="pair-col">${round.map(w=>`<button class="tile" data-left="${w.id}" lang="ms">${w.ms}</button>`).join('')}</div><div class="pair-col">${right.map(w=>`<button class="tile" data-right="${w.id}">${w.zh}</button>`).join('')}</div></div><p class="feedback" id="feedback">选一个马来文开始吧。</p><div class="actions" id="matchNext"></div>`;document.querySelectorAll('[data-left]').forEach(b=>b.onclick=()=>{if(locked)return;document.querySelectorAll('[data-left]').forEach(x=>x.classList.remove('selected'));selected=+b.dataset.left;b.classList.add('selected');$('#feedback').textContent='现在选择右边的中文。'});document.querySelectorAll('[data-right]').forEach(b=>b.onclick=()=>{if(locked||selected===null)return;const w=byId[selected],l=document.querySelector(`[data-left="${selected}"]`);if(+b.dataset.right===selected){matched.add(selected);l.classList.remove('selected');l.classList.add('done');b.classList.add('done');l.disabled=b.disabled=true;win(w);selected=null;$('#pairCount').textContent=`${matched.size} / ${round.length} 对`;$('#feedback').textContent=`答对了！${w.ms}＝${w.zh}`;if(matched.size===round.length){$('#matchNext').innerHTML='<button class="primary" id="toQuiz">继续选词闯关 →</button>';$('#toQuiz').onclick=()=>start('quiz')}}else{wrong(w);$('#feedback').textContent=`再认一次：${w.ms}＝${w.zh}。请重新配对。`;b.classList.add('incorrect');locked=true;setTimeout(()=>{b.classList.remove('incorrect');locked=false},700)}})}
function question(){const w=round[index];const choices=shuffle([w,...shuffle(words.filter(x=>x.group===w.group&&x.id!==w.id)).slice(0,3)]).map(x=>x.zh);panel.innerHTML=head(retry?'错题重练 · 答对后移出错题本':'选一选 · 这个词是什么意思？')+`<div class="card"><div class="emoji">${w.icon}</div><div class="word" lang="ms">${w.ms}</div></div><div class="options">${choices.map((t,i)=>`<button class="option" data-choice="${i}">${t}</button>`).join('')}</div><div class="feedback" id="feedback">选出正确的中文意思。</div><div class="actions" id="next"></div>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(locked)return;locked=true;const answer=w.zh,ok=choices[+b.dataset.choice]===answer;document.querySelectorAll('[data-choice]').forEach(x=>{x.disabled=true;if(choices[+x.dataset.choice]===answer)x.classList.add('correct')});if(ok){score++;win(w)}else{b.classList.add('incorrect');wrong(w)}$('#feedback').textContent=`${ok?'✓ 答对了！':'再认一次：'}${w.ms}＝${w.zh}。`;$('#next').innerHTML=`<div class="hint">${w.hint}</div><button class="primary" id="nextBtn">${index===round.length-1?'看本轮结果':'下一题 →'}</button>`;$('#nextBtn').onclick=()=>{index++;locked=false;render()}})}
function finish(){const isLearn=mode==='learn';panel.innerHTML=`<div class="empty"><div class="emoji">${isLearn?'🌱':'🎉'}</div><h2>${isLearn?`${round.length}个词，认完啦！`:'本轮完成！'}</h2>${!isLearn?`<div class="count">${score} / ${round.length}</div><p>这是本轮首次作答的正确数。答错的词已放进错题本。</p>`:'<p>接下来配一配，看看记住了多少。</p>'}<div class="actions"><button class="primary" id="continue">${isLearn?'开始中马配对':'再练一轮'}</button><button class="secondary" id="reviewNow">查看错题本</button></div></div>`;$('#continue').onclick=()=>{if(isLearn)start('match');else{const m=mode;round=getRound();start(m)}};$('#reviewNow').onclick=()=>start('review')}
function review(){const list=state.wrong.map(id=>byId[id]);panel.innerHTML=`<div class="panel-head"><b>我的错题本</b><span>${list.length} 个词待复习</span></div>${list.length?`<p>先看一遍，再重练。每轮最多10题；不足10个时练习全部错词。答对后自动移出。</p><button class="primary" id="retry">重练${Math.min(ROUND_SIZE,list.length)}个词 →</button><div>${list.map(w=>`<div class="review-item"><div><b lang="ms">${w.icon} ${w.ms}</b><small>${w.hint}</small></div><strong>${w.zh}</strong></div>`).join('')}</div>`:'<div class="empty"><div class="emoji">🌟</div><h2>暂时没有错题</h2><p>去配对或闯关吧，遇到不熟悉的词会自动记在这里。</p><button class="primary" id="backLearn">去认词</button></div>'}`;if(list.length)$('#retry').onclick=()=>{round=shuffle(list).slice(0,ROUND_SIZE);reset();mode='quiz';retry=true;render()};else $('#backLearn').onclick=()=>start('learn')}

function exerciseFigure(kind){if(kind==='chain2')return `<div class="bm-figure"><b>Rantai makanan di sawah padi</b><p>Pokok padi → Belalang → Katak → Ular</p><p class="subtle">Anak panah menunjukkan arah pemindahan tenaga.</p></div>`;if(kind==='pyramid2')return `<div class="bm-figure"><table><caption>Piramid nombor dalam contoh sawah padi</caption><thead><tr><th>Aras</th><th>Organisma</th><th>Bilangan</th></tr></thead><tbody><tr><td>Pengguna tertier</td><td>Helang</td><td>3</td></tr><tr><td>Pengguna sekunder</td><td>Ular</td><td>300</td></tr><tr><td>Pengguna primer</td><td>Tikus</td><td>3 000</td></tr><tr><td>Pengeluar</td><td>Pokok padi</td><td>300 000</td></tr></tbody></table><p class="subtle">Pokok padi → Tikus → Ular → Helang</p></div>`;if(kind==='temp2')return `<div class="bm-figure"><div class="diagram"><div><b>Ruang A</b><br>Air panas di bawah kasa dawai<br>Keadaan lebih panas</div><div><b>Ruang B</b><br>Air pada suhu bilik<br>Keadaan suhu bilik</div></div><p class="subtle">8 ekor kutu kayu diletakkan di atas kasa dawai. Cahaya dan kelembapan dikekalkan sama. Pemerhatian yang diberikan: semua berkumpul di ruang B.</p></div>`;if(kind==='light2')return `<div class="bm-figure"><div class="diagram"><div><b>Ruang P</b><br>Terdedah kepada cahaya</div><div><b>Ruang Q</b><br>Ditutup dengan kain hitam</div></div><p class="subtle">Kedua-dua ruang mengandungi air pada suhu bilik. Bilangan awal kutu kayu, suhu dan kelembapan dikekalkan sama.</p></div>`;if(kind==='animalkey')return `<div class="bm-figure"><table><caption>Kekunci dikotomi haiwan</caption><tbody><tr><td>1(a) Ada tulang belakang → 2</td><td>1(b) Tiada tulang belakang → 4</td></tr><tr><td>2(a) Ada sayap → 3</td><td>2(b) Tiada sayap → Ular*</td></tr><tr><td>3(a) Bulu pelepah → Burung</td><td>3(b) Rambut → Kelawar</td></tr><tr><td>4(a) Tiga pasang kaki → Belalang</td><td>4(b) Empat pasang kaki → Labah-labah</td></tr></tbody></table><p class="subtle">*Kekunci ini hanya untuk lima organisma: burung, kelawar, ular, belalang dan labah-labah.</p></div>`;if(kind==='plantkey')return `<div class="bm-figure"><table><caption>Kekunci dikotomi tumbuhan</caption><tbody><tr><td>1(a) Berbunga → Pokok padi*</td><td>1(b) Tidak berbunga → 2</td></tr><tr><td>2(a) Ada tisu vaskular → 3</td><td>2(b) Tiada tisu vaskular → Lumut</td></tr><tr><td>3(a) Melalui spora → Paku pakis</td><td>3(b) Biji benih dalam kon → Pokok pain</td></tr></tbody></table><p class="subtle">*Kekunci ini hanya untuk pokok padi, lumut, paku pakis dan pokok pain.</p></div>`;if(kind==='table')return `<div class="bm-figure"><div class="scroll-table"><table><caption>Jadual pemerhatian</caption><thead><tr><th>Haiwan</th><th>Habitat</th><th>Tulang belakang</th></tr></thead><tbody><tr><td>Ikan emas</td><td>Air</td><td>Ada</td></tr><tr><td>Kumbang</td><td>Darat</td><td>Tiada</td></tr><tr><td>Ayam belanda</td><td>Darat</td><td>Ada</td></tr><tr><td>Sotong</td><td>Air</td><td>Tiada</td></tr></tbody></table></div></div>`;if(kind==='pq')return `<div class="bm-figure"><div class="diagram"><div><b>Haiwan P</b><br>Hidup di darat<br>Bernafas melalui peparu<br>Mempunyai bulu pelepah<br>Bertelur · Ada tulang belakang</div><div><b>Haiwan Q</b><br>Hidup di dalam air<br>Bernafas melalui insang<br>Badan bersisik<br>Bertelur · Ada tulang belakang</div></div></div>`;if(kind==='octopus')return `<div class="bm-figure"><div class="diagram"><div><b>🐙 Haiwan P</b><br>Sotong kurita</div><div><b>🐢 Haiwan Q</b><br>Kura-kura</div></div></div>`;return ''}
function renderExercise(){saveExerciseWrong();if(!exerciseRound.length){panel.innerHTML='<div class="empty"><div class="emoji">🌟</div><h2>Tiada soalan salah buat masa ini.</h2><p>Cuba satu set latihan dahulu.</p><button class="primary" id="emptyBM">Mula 10 soalan</button></div>';$('#emptyBM').onclick=()=>beginExercise();return}if(exerciseIndex>=exerciseRound.length)return finishExercise();const q=exerciseRound[exerciseIndex];exerciseLocked=false;exerciseSelected=new Set();panel.innerHTML=`<div class="panel-head"><b>${exerciseRetry?'Ulang kaji soalan salah':exerciseNames[exerciseTopic]}</b><span>Soalan ${exerciseIndex+1} / ${exerciseRound.length}</span></div><div class="progress"><i style="width:${exerciseIndex/exerciseRound.length*100}%"></i></div><div class="bm-question">${q.q}</div><div class="bm-note">${q.kind==='multi'?'<span class="multi-note">Pilih semua jawapan yang betul.</span>':q.kind==='text'?'Taip jawapan dalam Bahasa Melayu.':'Pilih satu jawapan yang betul.'}</div>${exerciseFigure(q.figure)}<details class="zh-help"><summary>中文提示 / Petunjuk bahasa Cina</summary><p>${q.zh}</p></details>${q.kind==='text'?`<form id="bmForm"><label for="bmAnswer" class="bm-note">Jawapan anda</label><div style="margin-top:8px"><input class="answer-entry" id="bmAnswer" autocomplete="off" placeholder="Taip jawapan di sini" required></div><div class="actions"><button class="primary" type="submit">Semak jawapan</button></div></form>`:`<div class="options question-options">${q.options.map((v,i)=>`<button class="option bm-option" data-bm-choice="${i}" ${q.kind==='multi'?'aria-pressed="false"':''}>${v}</button>`).join('')}</div>${q.kind==='multi'?'<div class="actions"><button class="primary" id="bmCheck" disabled>Semak jawapan</button></div>':''}`}<div id="bmFeedback"></div><div class="actions" id="bmNext"></div><p class="subtle">Aras Form 2 · Bab 2. Berdasarkan halaman 186–195 yang diberikan; ikon hanya sebagai petunjuk.</p>`;if(q.kind==='text')$('#bmForm').onsubmit=e=>{e.preventDefault();if($('#bmAnswer').value.trim())gradeExercise($('#bmAnswer').value)};else document.querySelectorAll('[data-bm-choice]').forEach(b=>b.onclick=()=>{if(exerciseLocked)return;const i=+b.dataset.bmChoice;if(q.kind==='multi'){if(exerciseSelected.has(i))exerciseSelected.delete(i);else exerciseSelected.add(i);b.setAttribute('aria-pressed',exerciseSelected.has(i));$('#bmCheck').disabled=exerciseSelected.size===0}else gradeExercise(q.options[i])});if(q.kind==='multi')$('#bmCheck').onclick=()=>gradeExercise([...exerciseSelected].map(i=>q.options[i]))}
function gradeExercise(value){if(exerciseLocked)return;exerciseLocked=true;const q=exerciseRound[exerciseIndex],answers=Array.isArray(q.answer)?q.answer:[q.answer];const ok=q.kind==='multi'?value.length===answers.length&&answers.every(a=>value.includes(a)):q.kind==='text'?answers.some(a=>normaliseAnswer(a)===normaliseAnswer(value)):value===q.answer;if(ok){exerciseScore++;state.stars++;if(exerciseRetry)exerciseWrong=exerciseWrong.filter(id=>id!==q.id)}else if(!exerciseWrong.includes(q.id))exerciseWrong.push(q.id);persist();saveExerciseWrong();document.querySelectorAll('[data-bm-choice]').forEach(b=>{b.disabled=true;const v=q.options[+b.dataset.bmChoice];if(answers.includes(v))b.classList.add('correct');else if(q.kind==='multi'?value.includes(v):value===v)b.classList.add('incorrect')});if($('#bmCheck'))$('#bmCheck').disabled=true;if($('#bmAnswer')){$('#bmAnswer').disabled=true;$('#bmForm button').disabled=true}const correct=q.kind==='text'?answers[0]:answers.join('; ');$('#bmFeedback').innerHTML=`<div class="bm-feedback ${ok?'':'bad'}"><strong>${ok?'✓ Betul!':'Cuba ingat semula.'}</strong><br><b>Jawapan: ${correct}</b><br>${q.why}</div>`;$('#bmNext').innerHTML=`<button class="primary" id="nextBM">${exerciseIndex===exerciseRound.length-1?'Lihat keputusan':'Soalan seterusnya →'}</button>`;$('#nextBM').onclick=()=>{exerciseIndex++;renderExercise()}}
function finishExercise(){panel.innerHTML=`<div class="bm-result"><div class="emoji">${exerciseScore===exerciseRound.length?'🏆':'🌱'}</div><h2>Latihan selesai!</h2><div class="count">${exerciseScore} / ${exerciseRound.length}</div><p>Markah berdasarkan jawapan pertama. Setiap soalan membawa satu markah.</p><div class="actions"><button class="primary" id="againBM">Set baharu · 10 soalan</button><button class="secondary" id="mistakesBM">Ulang soalan salah (${exerciseWrong.length})</button></div>${exerciseRetry&&exerciseRound.length<10?'<p class="subtle">Bilangan soalan mengikut jumlah soalan salah yang tersedia.</p>':''}</div><div class="bm-wrong-list">${exerciseRound.map(q=>`<div class="bm-wrong-item"><b>${q.q}</b>Jawapan: ${(Array.isArray(q.answer)?q.kind==='text'?[q.answer[0]]:q.answer:[q.answer]).join('; ')}<br>${q.why}</div>`).join('')}</div>`;$('#againBM').onclick=()=>beginExercise();$('#mistakesBM').onclick=()=>beginExercise(exerciseTopic,true)}
$('#exerciseTopic').onchange=e=>beginExercise(e.target.value);$('#newExercise').onclick=()=>beginExercise();$('#wrongExercise').onclick=()=>beginExercise(exerciseTopic,true);saveExerciseWrong();
if(location.hash==='#latihan-bm')start('bm');

</script></body></html>
