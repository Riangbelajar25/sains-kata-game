": "f2b1-kekunci-7", "topic": "kekunci", "q": "Berdasarkan jadual pemerhatian, pilih semua vertebrata.", "options": ["Ikan emas", "Kumbang", "Ayam belanda", "Sotong"], "answer": ["Ikan emas", "Ayam belanda"], "why": "Ikan emas dan ayam belanda mempunyai tulang belakang.", "zh": "根据表格，选出脊椎动物。", "kind": "multi", "figure": "table"}, {"id": "f2b1-kekunci-8", "topic": "kekunci", "q": "Apakah kesimpulan yang disokong oleh jadual?", "options": ["Haiwan air boleh terdiri daripada vertebrata atau invertebrata.", "Semua haiwan air ialah vertebrata.", "Semua haiwan darat ialah invertebrata.", "Habitat sahaja menentukan kehadiran tulang belakang."], "answer": "Haiwan air boleh terdiri daripada vertebrata atau invertebrata.", "why": "Ikan emas dan sotong hidup di dalam air, tetapi hanya ikan emas mempunyai tulang belakang.", "zh": "同样生活在水中，是否一定都有脊柱？", "kind": "single", "figure": "table"}, {"id": "f2b1-kekunci-9", "topic": "kekunci", "q": "Pilih semua pasangan ciri yang sesuai digunakan dalam satu langkah kekunci dikotomi.", "options": ["Mempunyai tulang belakang / Tiada tulang belakang", "Berbunga / Tidak berbunga", "Mempunyai sayap / Tidak mempunyai sayap", "Hidup di darat / Berwarna hijau"], "answer": ["Mempunyai tulang belakang / Tiada tulang belakang", "Berbunga / Tidak berbunga", "Mempunyai sayap / Tidak mempunyai sayap"], "why": "Dua pilihan perlu membezakan ciri yang sama secara jelas. Darat dan hijau bukan dua keadaan berlawanan bagi satu ciri.", "zh": "选出适合用作二歧检索同一步的成对特征。", "kind": "multi", "figure": null}, {"id": "f2b1-kekunci-10", "topic": "kekunci", "q": "Tumbuhan X mempunyai urat daun jejala dan akar tunjang. Nyatakan kumpulannya.", "options": [], "answer": ["dikotiledon", "tumbuhan dikotiledon"], "why": "Urat daun jejala dan akar tunjang ialah ciri dikotiledon.", "zh": "网状叶脉、直根，属于哪类植物？", "kind": "text", "figure": null}];

function beginExercise(topic=exerciseTopic,redo=false){exerciseTopic=topic;exerciseRetry=redo;exerciseIndex=0;exerciseScore=0;exerciseLocked=false;exerciseSelected=new Set();const pool=exerciseBank.filter(q=>redo?exerciseWrong.includes(q.id):topic==='all'||q.topic===topic);exerciseRound=shuffle(pool).slice(0,10);renderExercise()}
function exerciseFigure(kind){if(kind==='animalkey')return `<div class="bm-figure"><table><caption>Kekunci dikotomi haiwan</caption><tbody><tr><td>1(a) Ada tulang belakang → 2</td><td>1(b) Tiada tulang belakang → 4</td></tr><tr><td>2(a) Ada sayap → 3</td><td>2(b) Tiada sayap → Ular*</td></tr><tr><td>3(a) Bulu pelepah → Burung</td><td>3(b) Rambut → Kelawar</td></tr><tr><td>4(a) Tiga pasang kaki → Belalang</td><td>4(b) Empat pasang kaki → Labah-labah</td></tr></tbody></table><p class="subtle">*Kekunci ini hanya untuk lima organisma: burung, kelawar, ular, belalang dan labah-labah.</p></div>`;if(kind==='plantkey')return `<div class="bm-figure"><table><caption>Kekunci dikotomi tumbuhan</caption><tbody><tr><td>1(a) Berbunga → Pokok padi*</td><td>1(b) Tidak berbunga → 2</td></tr><tr><td>2(a) Ada tisu vaskular → 3</td><td>2(b) Tiada tisu vaskular → Lumut</td></tr><tr><td>3(a) Melalui spora → Paku pakis</td><td>3(b) Biji benih dalam kon → Pokok pain</td></tr></tbody></table><p class="subtle">*Kekunci ini hanya untuk pokok padi, lumut, paku pakis dan pokok pain.</p></div>`;if(kind==='table')return `<div class="bm-figure"><div class="scroll-table"><table><caption>Jadual pemerhatian</caption><thead><tr><th>Haiwan</th><th>Habitat</th><th>Tulang belakang</th></tr></thead><tbody><tr><td>Ikan emas</td><td>Air</td><td>Ada</td></tr><tr><td>Kumbang</td><td>Darat</td><td>Tiada</td></tr><tr><td>Ayam belanda</td><td>Darat</td><td>Ada</td></tr><tr><td>Sotong</td><td>Air</td><td>Tiada</td></tr></tbody></table></div></div>`;if(kind==='pq')return `<div class="bm-figure"><div class="diagram"><div><b>Haiwan P</b><br>Hidup di darat<br>Bernafas melalui peparu<br>Mempunyai bulu pelepah<br>Bertelur · Ada tulang belakang</div><div><b>Haiwan Q</b><br>Hidup di dalam air<br>Bernafas melalui insang<br>Badan bersisik<br>Bertelur · Ada tulang belakang</div></div></div>`;if(kind==='octopus')return `<div class="bm-figure"><div class="diagram"><div><b>🐙 Haiwan P</b><br>Sotong kurita</div><div><b>🐢 Haiwan Q</b><br>Kura-kura</div></div></div>`;return ''}
function renderExercise(){saveExerciseWrong();if(!exerciseRound.length){panel.innerHTML='<div class="empty"><div class="emoji">🌟</div><h2>Tiada soalan salah buat masa ini.</h2><p>Cuba satu set latihan dahulu.</p><button class="primary" id="emptyBM">Mula 10 soalan</button></div>';$('#emptyBM').onclick=()=>beginExercise();return}if(exerciseIndex>=exerciseRound.length)return finishExercise();const q=exerciseRound[exerciseIndex];exerciseLocked=false;exerciseSelected=new Set();panel.innerHTML=`<div class="panel-head"><b>${exerciseRetry?'Ulang kaji soalan salah':exerciseNames[exerciseTopic]}</b><span>Soalan ${exerciseIndex+1} / ${exerciseRound.length}</span></div><div class="progress"><i style="width:${exerciseIndex/exerciseRound.length*100}%"></i></div><div class="bm-question">${q.q}</div><div class="bm-note">${q.kind==='multi'?'<span class="multi-note">Pilih semua jawapan yang betul.</span>':q.kind==='text'?'Taip jawapan dalam Bahasa Melayu.':'Pilih satu jawapan yang betul.'}</div>${exerciseFigure(q.figure)}<details class="zh-help"><summary>中文提示 / Petunjuk bahasa Cina</summary><p>${q.zh}</p></details>${q.kind==='text'?`<form id="bmForm"><label for="bmAnswer" class="bm-note">Jawapan anda</label><div style="margin-top:8px"><input class="answer-entry" id="bmAnswer" autocomplete="off" placeholder="Taip jawapan di sini" required></div><div class="actions"><button class="primary" type="submit">Semak jawapan</button></div></form>`:`<div class="options question-options">${q.options.map((v,i)=>`<button class="option bm-option" data-bm-choice="${i}" ${q.kind==='multi'?'aria-pressed="false"':''}>${v}</button>`).join('')}</div>${q.kind==='multi'?'<div class="actions"><button class="primary" id="bmCheck" disabled>Semak jawapan</button></div>':''}`}<div id="bmFeedback"></div><div class="actions" id="bmNext"></div><p class="subtle">Aras Form 2 · Bab 1. Bentuk latihan diadaptasi daripada contoh gambar; ikon hanya sebagai petunjuk.</p>`;if(q.kind==='text')$('#bmForm').onsubmit=e=>{e.preventDefault();if($('#bmAnswer').value.trim())gradeExercise($('#bmAnswer').value)};else document.querySelectorAll('[data-bm-choice]').forEach(b=>b.onclick=()=>{if(exerciseLocked)return;const i=+b.dataset.bmChoice;if(q.kind==='multi'){if(exerciseSelected.has(i))exerciseSelected.delete(i);else exerciseSelected.add(i);b.setAttribute('aria-pressed',exerciseSelected.has(i));$('#bmCheck').disabled=exerciseSelected.size===0}else gradeExercise(q.options[i])});if(q.kind==='multi')$('#bmCheck').onclick=()=>gradeExercise([...exerciseSelected].map(i=>q.options[i]))}
function gradeExercise(value){if(exerciseLocked)return;exerciseLocked=true;const q=exerciseRound[exerciseIndex],answers=Array.isArray(q.answer)?q.answer:[q.answer];const ok=q.kind==='multi'?value.length===answers.length&&answers.every(a=>value.includes(a)):q.kind==='text'?answers.some(a=>normaliseAnswer(a)===normaliseAnswer(value)):value===q.answer;if(ok){exerciseScore++;state.stars++;if(exerciseRetry)exerciseWrong=exerciseWrong.filter(id=>id!==q.id)}else if(!exerciseWrong.includes(q.id))exerciseWrong.push(q.id);persist();saveExerciseWrong();document.querySelectorAll('[data-bm-choice]').forEach(b=>{b.disabled=true;const v=q.options[+b.dataset.bmChoice];if(answers.includes(v))b.classList.add('correct');else if(q.kind==='multi'?value.includes(v):value===v)b.classList.add('incorrect')});if($('#bmCheck'))$('#bmCheck').disabled=true;if($('#bmAnswer')){$('#bmAnswer').disabled=true;$('#bmForm button').disabled=true}const correct=q.kind==='text'?answers[0]:answers.join('; ');$('#bmFeedback').innerHTML=`<div class="bm-feedback ${ok?'':'bad'}"><strong>${ok?'✓ Betul!':'Cuba ingat semula.'}</strong><br><b>Jawapan: ${correct}</b><br>${q.why}</div>`;$('#bmNext').innerHTML=`<button class="primary" id="nextBM">${exerciseIndex===exerciseRound.length-1?'Lihat keputusan':'Soalan seterusnya →'}</button>`;$('#nextBM').onclick=()=>{exerciseIndex++;renderExercise()}}
