</style></head><body><header><nav><div class="brand">🌿 科学认字小探险<small>SAINS KATA · TINGKATAN 2</small></div><span class="badge" id="stars">⭐ 0 次答对</span></nav></header><main><section class="hero"><div><div class="eyebrow">BAB 1 / BIODIVERSITI</div><h1>每天5个词，<br>科学慢慢读得懂。</h1><p>先认词，再闯关。中文陪你理解，马来文帮你记牢。</p></div><div class="hero-art" aria-hidden="true">🐸</div></section><div class="tools"><label for="group">今天学什么</label><select id="group"></select><button class="secondary" id="newRound">换一组5词 ↻</button></div><div class="tabs" aria-label="游戏模式"><button class="tab active" data-mode="learn">① 认词卡</button><button class="tab" data-mode="match">② 中马配对</button><button class="tab" data-mode="quiz">③ 选词闯关</button><button class="tab" data-mode="classify">④ 动物分类</button><button class="tab" data-mode="review">错题本 <span id="wrongCount">0</span></button></div><section class="panel" id="panel" aria-live="polite"></section><footer class="foot"><span>不计时，慢慢想。答错也没关系，再认一次就好。</span><span>进度保存在当前浏览器 · 图示仅作记忆提示</span></footer></main><script>

['animals','Katak','青蛙','🐸','两栖类：Amfibia。','两栖类'],['animals','Kelawar','蝙蝠','🦇','会飞的哺乳动物。','哺乳类'],['animals','Ular','蛇','🐍','没有脚的爬行动物。','爬行类'],['animals','Ikan paus','鲸','🐋','虽然名字有 ikan，但鲸属于哺乳类。','哺乳类'],['animals','Penyu','海龟','🐢','生活在海里的爬行动物。','爬行类'],['animals','Helang','鹰','🦅','身体覆盖羽毛。','鸟类'],['animals','Penguin','企鹅','🐧','不会飞的鸟类。','鸟类'],['animals','Jerung','鲨鱼','🦈','用鳃呼吸，属于鱼类。','鱼类'],['animals','Labah-labah','蜘蛛','🕷️','四对脚，没有脊柱。','无脊椎动物'],['animals','Belalang','蚱蜢','🦗','三对脚，有触角。','无脊椎动物'],['animals','Rama-rama','蝴蝶','🦋','昆虫，三对脚。','无脊椎动物'],['animals','Harimau','老虎','🐅','有毛发，用乳汁喂养幼儿。','哺乳类'],['animals','Buaya','鳄鱼','🐊','皮肤坚硬，有鳞片。','爬行类'],['animals','Ayam','鸡','🐔','有羽毛、喙和翅膀。','鸟类'],['animals','Kuda laut','海马','🌊','名字有 kuda（马），但属于鱼类。','鱼类'],

const words=raw.map((a,id)=>({id,group:a[0],ms:a[1],zh:a[2],icon:a[3],hint:a[4],cat:a[5]}));let saved;try{saved=JSON.parse(localStorage.getItem('sains-kata-v1')||'{}')}catch{}let state={stars:0,wrong:[],...saved};state.wrong=state.wrong.filter(id=>words[id]);let mode='learn',group='body',round=[],index=0,revealed=false,locked=false,score=0,selected=null,matched=new Set(),retry=false;const $=s=>document.querySelector(s),panel=$('#panel');const shuffle=a=>[...a].sort(()=>Math.random()-.5);function persist(){try{localStorage.setItem('sains-kata-v1',JSON.stringify(state))}catch{}$('#stars').textContent=`⭐ ${state.stars} 次答对`;$('#wrongCount').textContent=state.wrong.length}function wrong(w){if(!state.wrong.includes(w.id))state.wrong.push(w.id);persist()}function win(w){state.stars++;if(retry)state.wrong=state.wrong.filter(id=>id!==w.id);persist()}function getRound(){return shuffle(words.filter(w=>w.group===group)).slice(0,5)}function reset(){index=0;score=0;revealed=false;locked=false;selected=null;matched=new Set()}function start(m){mode=m;retry=false;reset();if(m==='classify')round=shuffle(words.filter(w=>w.cat)).slice(0,5);else if(m!=='review'&&(round.length!==5||round.some(w=>w.group!==group)))round=getRound();document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('active',b.dataset.mode===m);b.setAttribute('aria-pressed',b.dataset.mode===m)});render()}function head(label){return `<div class="panel-head"><b>${label}</b><span>${index+1} / ${round.length}</span></div><div class="progress"><i style="width:${index/round.length*100}%"></i></div>`}function render(){persist();document.querySelectorAll('.tab').forEach(b=>{const active=b.dataset.mode===(retry?'review':mode);b.classList.toggle('active',active);b.setAttribute('aria-pressed',active)});if(mode==='review')return review();if(index>=round.length)return finish();if(mode==='learn')return learn();if(mode==='match')return match();question()}
function learn(){const w=round[index];panel.innerHTML=head('认一认 · 先看马来文')+`<div class="card"><div class="emoji">${w.icon}</div><div class="word" lang="ms">${w.ms}</div>${revealed?`<div class="translation">${w.zh}</div><div class="hint">${w.hint}</div>`:'<p>先想想它的意思，再翻开答案。</p>'}</div><div class="actions"><button class="secondary" id="speak">🔊 听读音</button><button class="primary" id="flip">${revealed?'下一个词 →':'翻开中文'}</button></div><div class="subtle" id="speechNote" style="text-align:center;margin-top:14px">读音由设备提供，部分设备可能没有马来语语音。</div>`;$('#flip').onclick=()=>{if(revealed){index++;revealed=false}else revealed=true;render()};$('#speak').onclick=()=>speak(w.ms)}
function speak(t){if(!('speechSynthesis'in window)){$('#speechNote').textContent='这台设备暂不支持朗读，可以先看词卡练习。';return}const voices=speechSynthesis.getVoices(),v=voices.find(v=>v.lang.toLowerCase().startsWith('ms'));const u=new SpeechSynthesisUtterance(t);u.lang='ms-MY';u.rate=.75;if(v)u.voice=v;u.onerror=()=>{$('#speechNote').textContent='暂时无法播放读音，请继续看词卡练习。'};speechSynthesis.cancel();speechSynthesis.speak(u)}
function match(){const right=shuffle(round);panel.innerHTML=`<div class="panel-head"><b>配一配 · 先点马来文，再点中文</b><span id="pairCount">0 / 5 对</span></div><p class="subtle">同一轮的5个词，配对成功后会变绿。</p><div class="pair-grid"><div class="pair-col">${round.map(w=>`<button class="tile" data-left="${w.id}" lang="ms">${w.ms}</button>`).join('')}</div><div class="pair-col">${right.map(w=>`<button class="tile" data-right="${w.id}">${w.zh}</button>`).join('')}</div></div><p class="feedback" id="feedback">选一个马来文开始吧。</p><div class="actions" id="matchNext"></div>`;document.querySelectorAll('[data-left]').forEach(b=>b.onclick=()=>{if(locked)return;document.querySelectorAll('[data-left]').forEach(x=>x.classList.remove('selected'));selected=+b.dataset.left;b.classList.add('selected');$('#feedback').textContent='现在选择右边的中文。'});document.querySelectorAll('[data-right]').forEach(b=>b.onclick=()=>{if(locked||selected===null)return;const w=words[selected],l=document.querySelector(`[data-left="${selected}"]`);if(+b.dataset.right===selected){matched.add(selected);l.classList.remove('selected');l.classList.add('done');b.classList.add('done');l.disabled=b.disabled=true;win(w);selected=null;$('#pairCount').textContent=`${matched.size} / 5 对`;$('#feedback').textContent=`答对了！${w.ms}＝${w.zh}`;if(matched.size===5){$('#matchNext').innerHTML='<button class="primary" id="toQuiz">继续选词闯关 →</button>';$('#toQuiz').onclick=()=>start('quiz')}}else{wrong(w);$('#feedback').textContent=`再认一次：${w.ms}＝${w.zh}。请重新配对。`;b.classList.add('incorrect');locked=true;setTimeout(()=>{b.classList.remove('incorrect');locked=false},700)}})}
function question(){const w=round[index],isCat=mode==='classify';const cats=['哺乳类','爬行类','两栖类','鸟类','鱼类','无脊椎动物'];const choices=isCat?cats:shuffle([w,...shuffle(words.filter(x=>x.group===w.group&&x.id!==w.id)).slice(0,3)]).map(x=>x.zh);panel.innerHTML=head(retry?'错题重练 · 答对后移出错题本':isCat?'分一分 · 它属于哪一类？':'选一选 · 这个词是什么意思？')+`<div class="card"><div class="emoji">${w.icon}</div><div class="word" lang="ms">${w.ms}</div>${isCat?`<div class="subtle">${w.zh}</div>`:''}</div><div class="options">${choices.map((t,i)=>`<button class="option" data-choice="${i}">${t}</button>`).join('')}</div><div class="feedback" id="feedback">${isCat?'想想它的身体特征。':'选出正确的中文意思。'}</div><div class="actions" id="next"></div>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(locked)return;locked=true;const answer=isCat?w.cat:w.zh,ok=choices[+b.dataset.choice]===answer;document.querySelectorAll('[data-choice]').forEach(x=>{x.disabled=true;if(choices[+x.dataset.choice]===answer)x.classList.add('correct')});if(ok){score++;win(w)}else{b.classList.add('incorrect');wrong(w)}$('#feedback').textContent=`${ok?'✓ 答对了！':'再认一次：'}${w.ms}＝${w.zh}${isCat?'，属于'+w.cat:''}。`;$('#next').innerHTML=`<div class="hint">${w.hint}</div><button class="primary" id="nextBtn">${index===round.length-1?'看本轮结果':'下一题 →'}</button>`;$('#nextBtn').onclick=()=>{index++;locked=false;render()}})}
function finish(){const isLearn=mode==='learn';panel.innerHTML=`<div class="empty"><div class="emoji">${isLearn?'🌱':'🎉'}</div><h2>${isLearn?'5个词，认完啦！':'本轮完成！'}</h2>${!isLearn?`<div class="count">${score} / ${round.length}</div><p>这是本轮首次作答的正确数。答错的词已放进错题本。</p>`:'<p>接下来配一配，看看记住了多少。</p>'}<div class="actions"><button class="primary" id="continue">${isLearn?'开始中马配对':'再练一轮'}</button><button class="secondary" id="reviewNow">查看错题本</button></div></div>`;$('#continue').onclick=()=>{if(isLearn)start('match');else{const m=mode;round=m==='classify'?shuffle(words.filter(w=>w.cat)).slice(0,5):getRound();start(m)}};$('#reviewNow').onclick=()=>start('review')}
function review(){const list=state.wrong.map(id=>words[id]);panel.innerHTML=`<div class="panel-head"><b>我的错题本</b><span>${list.length} 个词待复习</span></div>${list.length?`<p>先看一遍，再重练。重练答对的词会自动移出。</p><button class="primary" id="retry">重练${Math.min(5,list.length)}个词 →</button><div>${list.map(w=>`<div class="review-item"><div><b lang="ms">${w.icon} ${w.ms}</b><small>${w.hint}</small></div><strong>${w.zh}</strong></div>`).join('')}</div>`:'<div class="empty"><div class="emoji">🌟</div><h2>暂时没有错题</h2><p>去配对或闯关吧，遇到不熟悉的词会自动记在这里。</p><button class="primary" id="backLearn">去认词</button></div>'}`;if(list.length)$('#retry').onclick=()=>{round=shuffle(list).slice(0,5);reset();mode='quiz';retry=true;render()};else $('#backLearn').onclick=()=>start('learn')}
$('#group').innerHTML=Object.entries(groups).map(([v,t])=>`<option value="${v}">${t} · ${words.filter(w=>w.group===v).length}词</option>`).join('');$('#group').onchange=e=>{group=e.target.value;round=getRound();start('learn')};$('#newRound').onclick=()=>{round=getRound();start('learn')};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>start(b.dataset.mode));round=getRound();render();
</script></body></html>
